# Publishes text-db-query-ai to npm when a version tag (v*) is pushed, using npm
# trusted publishing (OIDC). No NPM_TOKEN secret is used. Releases get npm
# provenance ("Built and signed on GitHub Actions").
#
# One-time setup on npmjs.com (package owner, account with 2FA):
#   1. Open the package text-db-query-ai, then Settings, Trusted Publisher,
#      GitHub Actions, and enter exactly (all fields are case-sensitive):
#        Organization or user: jnkindi
#        Repository:           text-db-query-ai
#        Workflow filename:    publish.yml
#        Environment name:     leave blank (or "npm" if you enable `environment:` below)
#        Allowed actions:      tick "npm publish" (settings created after
#                              2026-09-03 allow only `npm stage publish` by default)
#      CLI equivalent (npm 11.15.0 or later):
#        npm trust github text-db-query-ai --file publish.yml \
#          --repo jnkindi/text-db-query-ai --allow-publish --allow-stage-publish
#   2. Publish within 48 hours. A trusted-publisher setting that has not been
#      used for a successful publish within 48 hours of its creation expires,
#      and must then be deleted and created again. To release the version that
#      is already in package.json (0.1.0):
#        git tag v0.1.0 && git push origin v0.1.0
#      Later releases: `npm version <patch|minor>`, then `git push origin main --follow-tags`.
#   3. After the first successful publish: Settings, Publishing access, "Require
#      two-factor authentication and disallow tokens"; delete the unused
#      NPM_TOKEN repository secret.
#
# npm does not check the setting when it is saved: a mismatch shows up only
# here, as ENEEDAUTH or E404. A setting cannot be edited, only recreated, so do
# not rename this file without recreating the setting.
#
# The build job has no publish credentials: it installs, builds, tests and packs.
# The publish job only uploads that exact tarball, so no dependency, build or
# test code runs in the job that can mint an npm token.
name: Publish to npm

on:
  push:
    tags:
      - "v*" # v0.1.0 publishes to "latest"; v0.2.0-beta.1 publishes to "next"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # never restore caches in a release build

      - name: Verify the tag matches the package.json version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # No lifecycle scripts: the tests need no install script (suites that use
      # the native sqlite3 binding skip themselves when it is missing).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures of dependencies
        run: npm audit signatures

      - name: Build
        run: npm run build

      - name: Check that public types do not expose SDK types
        run: node scripts/check-dts.js

      - name: Test
        run: npm test -- --ci

      - name: Pack and check the contents
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          # Same check as the CI pack job: only the "files" whitelist may ship.
          cat > "$RUNNER_TEMP/check-pack.js" <<'EOF'
          const [info] = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'));
          const allowed = /^(package\.json|LICENSE|NOTICE|[A-Z]+\.md|dist\/.+)$/;
          const testLike = /(^|\/)(__tests__|__mocks__|tests?)\/|\.(test|spec)\./;
          const bad = info.files.map((f) => f.path).filter((p) => !allowed.test(p) || testLike.test(p));
          for (const f of info.files) console.log(String(f.size).padStart(8), f.path);
          console.log(`${info.filename}: ${info.entryCount} files, ${info.unpackedSize} bytes unpacked`);
          if (bad.length > 0) {
            console.error(`::error::Unexpected files in the package: ${bad.join(', ')}`);
            process.exit(1);
          }
          EOF
          node "$RUNNER_TEMP/check-pack.js" "$RUNNER_TEMP/pack.json"
          mv "$RUNNER_TEMP/package/"*.tgz "$RUNNER_TEMP/package/text-db-query-ai.tgz"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/text-db-query-ai.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest # trusted publishing requires GitHub-hosted runners
    timeout-minutes: 10
    # Optional human gate: create a GitHub environment named "npm" with required
    # reviewers and a v* tag rule, uncomment this line, and enter "npm" as the
    # environment name in the npm trusted-publisher setting.
    # environment: npm
    permissions:
      contents: read
      id-token: write # lets npm exchange a GitHub OIDC token for a short-lived publish token
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11 (trusted publishing needs npm 11.5.1 or later).
          # Do not upgrade npm here: npm 12 changes install defaults.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check that npm supports trusted publishing
        run: |
          node --version
          npm --version
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("::error::npm " + process.argv[1] + " is too old for trusted publishing (need 11.5.1 or later)");
              process.exit(1);
            }
          ' "$(npm --version)"

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # npm uses the OIDC token before any configured token. --provenance is
      # implied for a public package from a public repository; passing it makes
      # npm fail instead of publishing without provenance. Publishing a tarball
      # runs no lifecycle scripts.
      # Stage-only alternative: replace `npm publish` with `npm stage publish`
      # and approve each version with 2FA (`npm stage approve <id>` or npmjs.com).
      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm publish "$RUNNER_TEMP/package/text-db-query-ai.tgz" --access public --tag "$DIST_TAG" --provenance

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release; this job has no npm credentials
    steps:
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          case "$TAG" in
            *-*) gh release create "$TAG" --verify-tag --generate-notes --prerelease ;;
            *)   gh release create "$TAG" --verify-tag --generate-notes ;;
          esac
